services:
  db:
    image: postgres:15-alpine
    container_name: gibag_db
    environment:
      POSTGRES_USER: gibag_user
      POSTGRES_PASSWORD: gibag_password
      POSTGRES_DB: gibag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gibag_user -d gibag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gibag_api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=gibag_db;Username=gibag_user;Password=gibag_password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5102:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gibag_web
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
