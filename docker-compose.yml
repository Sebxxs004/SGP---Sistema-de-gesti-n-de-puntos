version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gibag_db
    environment:
      POSTGRES_USER: gibag_user
      POSTGRES_PASSWORD: gibag_password
      POSTGRES_DB: gibag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: gibag_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gibag.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
